server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy (SSL termination) arkasında çalışıyoruz; otomatik yönlendirmeler
    # mutlak http:// şemasına düşmesin diye kapatıyoruz.
    absolute_redirect off;
    port_in_redirect off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Astro statik çıktısı (build.format: 'file'): temiz URL'ler, yönlendirmesiz
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    # Statik varlıklar — uzun cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 404
    error_page 404 /404.html;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
